<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AIEWF 2026 — Graph Explorer</title>
<meta name="description" content="An interactive map of every AI Engineer World's Fair 2026 talk, concept, and speaker — 231 talks, 134 concepts, ~250 speakers, ~2,300 connections.">
<link rel="stylesheet" href="explorer.css">
</head>
<body>

<div id="graph-container"></div>

<div class="loading" id="loading">Loading graph&hellip;</div>

<div class="topbar">
  <div class="brand">
    <span class="brand-title">AIEWF 2026 Graph Explorer</span>
    <span class="brand-sub">231 talks &middot; 134 concepts &middot; live speaker graph</span>
  </div>
  <div class="search-wrap">
    <input class="search-input" id="search-input" type="text"
           placeholder="Search talks, concepts, speakers&hellip;" autocomplete="off">
    <div class="search-results" id="search-results"></div>
  </div>
  <div class="legend" id="legend"></div>
  <button class="theme-toggle" id="theme-toggle" title="Toggle theme">Auto</button>
</div>

<div class="filters">
  <h3>Node types</h3>
  <div id="type-filters"></div>
  <div id="track-filters-wrap">
    <hr>
    <h3>Tracks</h3>
    <div class="track-list" id="track-filters"></div>
    <div class="filter-actions">
      <button id="tracks-all" type="button">All</button>
      <button id="tracks-none" type="button">None</button>
    </div>
  </div>
</div>

<div class="detail-panel" id="detail-panel"></div>

<div class="hint">Hover a node to see its neighborhood. Click for details. Search above to jump anywhere.</div>

<script src="../lib/graphology.umd.min.js"></script>
<script src="../lib/sigma.min.js"></script>
<script src="explorer.js"></script>
</body>
</html>
